  --kit-icon-size-small: 16px;

    snapWidths: [320, 480, 640], // double-click, Enter and Space cycle through these widths
    step: 8,                     // px per arrow key...
    bigStep: 32,                 // ...and per Shift+arrow
    initTimeoutMs: 500,          // stop waiting for code.ts after this (e.g. ui.html opened in a browser)

  // node:vm, so nothing here may touch the page or anything declared outside this block.

  // 4096 is ours, so a runaway number can't ask for an absurd window before kit:init arrives.
  const KIT_GENEROUS_BOUNDS = Object.freeze({ minWidth: 70, maxWidth: 4096, minHeight: 0, maxHeight: 4096 });

   * default, so the result is always safe to clamp against.
   * @param {Partial<KitBounds> | null | undefined} bounds
   * @returns {KitBounds}
   */
  function sanitizeBounds(bounds) {
    /** @type {Partial<KitBounds>} */
    const b = bounds !== null && typeof bounds === 'object' ? bounds : {};

    const minWidth = Math.max(g.minWidth, pick(b.minWidth, g.minWidth));
    const maxWidth = Math.max(minWidth, pick(b.maxWidth, g.maxWidth));
    const minHeight = Math.max(g.minHeight, pick(b.minHeight, g.minHeight));
    const maxHeight = Math.max(minHeight, pick(b.maxHeight, g.maxHeight));

   * Infinity: NaN (or a non-number) and -Infinity land on the minimum, +Infinity on the maximum.

   * @returns {KitSize}

  let handle = null;

  // ---- Request bookkeeping. Every size change goes through requestSize(), so the queued frame,
  // lastSent and the dedupe can't drift apart (the old script's direct sends did exactly that).
  /** @type {KitSize | null} */
  let lastSent = null;
  /** @type {KitQueuedSize | null} */
  let queued = null;
  let frame = 0;
  // The viewport lags one host round trip behind a request. Until the size last asked for has
  // landed, fits and gestures must start from it, per axis: a reflow from an older in-flight
  // size would drag the window back, and fast keys would each add their step to the same stale
  // size. Set in send(), cleared by onViewportResize() once the viewport gets there.
  /** @type {number | null} */
  let headingWidth = null;
  /** @type {number | null} */
  let headingHeight = null;
  // resizable Home changes the width, and content only reflows once that width lands; the
  // fitted height is measured again then.
  /** @type {number | null} */
  let refitAtWidth = null;
  /** @type {KitDragState | null} */
  let drag = null;
  // Whether the last press on the handle turned into a drag: the dblclick that the second press
  // of a double-click produces must not snap on top of that drag.
  let pressMoved = false;
  /** @type {ResizeObserver | null} */
  let observer = null;
  /** @type {Element | null} */
  let observedRoot = null;
  let retargetTimer = 0;

  /** @param {KitUiToMainMessage} message */
  function post(message) {
    // Opened directly in a browser there is no parent; the init timeout covers that case.
    if (window.parent === window) return;
    window.parent.postMessage({ pluginMessage: message }, '*');
  }

  /** @param {unknown} value @returns {value is KitMode} */
  function isMode(value) {
    return value === 'fit-content' || value === 'resizable' || value === 'fixed';
  }

  /** @param {unknown} value @returns {value is KitSize} */
  function isSize(value) {
    if (value === null || typeof value !== 'object') return false;
    const size = /** @type {Record<string, unknown>} */ (value);
    return typeof size.width === 'number' && Number.isFinite(size.width) && typeof size.height === 'number' && Number.isFinite(size.height);
  }

  function chromeOn() {
    return configured && chrome && mode !== 'fixed';
  }

  /** @returns {KitSize} */
  function viewportSize() {
    // A plugin window shown with visible:false may not be laid out yet (0 x 0); until it is, the
    // size code.ts reported in kit:init is the better answer.
    if (window.innerWidth > 0 || !initSize) return { width: window.innerWidth, height: window.innerHeight };
    return initSize;
  }

  /** @returns {number} */
  function targetWidth() {
    if (queued) return queued.width;
    if (drag) return drag.last.width;
    if (headingWidth !== null) return headingWidth;
    return viewportSize().width;
  }

  /** Where the window is, or is about to be. @returns {KitSize} */
  function currentSize() {
    const height = queued ? queued.height : drag ? drag.last.height : headingHeight !== null ? headingHeight : viewportSize().height;
    return { width: targetWidth(), height };
  }

  function findRoot() {
    return document.querySelector('[data-kit-root]') || document.body || document.documentElement;
  }

  /**
   * The height the content needs, whatever the window's height is now: the root's bottom edge
   * in document coordinates plus whatever spacing sits below it. This only works because the
   * root's height comes from its content: a root with height:100% or min-height:100vh tracks the
   * window instead, so the window can never shrink (docs/window-chrome.md).
   * @returns {number}
   */
  function contentHeight() {
    if (!(window.innerWidth > 0)) return viewportSize().height; // not laid out: nothing to measure
    const root = findRoot();
    const px = (/** @type {string} */ value) => parseFloat(value) || 0;
    let bottom = root.getBoundingClientRect().bottom + window.scrollY + px(getComputedStyle(root).marginBottom);
    const body = document.body;
    if (body && root !== body && body.contains(root)) {
      const style = getComputedStyle(body);
      bottom += px(style.paddingBottom) + px(style.borderBottomWidth) + px(style.marginBottom);
    }
    return Math.ceil(bottom);
  }

  function defaultWidth() {
    return defaultSize ? defaultSize.width : viewportSize().width;
  }

  /**
   * The single way to ask for a size. Coalesces to one message per frame unless `immediate` or
   * `final`; either of those cancels the queued frame first, so a stale frame can never land on
   * top of a revert or a final size.
   * @param {number} width
   * @param {number} height
   * @param {{ immediate?: boolean, final?: boolean, user?: boolean }} [options]
   */
  function requestSize(width, height, options = {}) {
    const size = clampSize(width, height, bounds);
    const user = options.user === true;
    if (options.immediate || options.final) {
      cancelFrame();
      send(size, user, options.final === true);
      return;
    }
    // A fit merged into a queued drag frame keeps the drag's user flag: the width is still theirs.
    queued = { width: size.width, height: size.height, user: user || (queued !== null && queued.user) };
    if (!frame) frame = requestAnimationFrame(flushFrame);
  }

  function cancelFrame() {
    if (frame) cancelAnimationFrame(frame);
    frame = 0;
    queued = null;
  }

  function flushFrame() {
    frame = 0;
    const next = queued;
    queued = null;
    if (next) send({ width: next.width, height: next.height }, next.user, false);
  }

  /** @param {KitSize} size @param {boolean} user @param {boolean} final */
  function send(size, user, final) {
    // Finals always go out: code.ts persists on them, and an Escape revert must win.
    if (!final && sameSize(size, lastSent)) return;
    lastSent = size;
    // A floating window (chrome on) lands on every size code.ts applies. A docked panel (chrome
    // off: Dev Mode, Buzz) is sized by Figma and may never match, so there the viewport is the truth.
    const track = chromeOn();
    headingWidth = track && size.width !== window.innerWidth ? size.width : null;
    headingHeight = track && size.height !== window.innerHeight ? size.height : null;
    /** @type {KitResizeMessage} */
    const message = { type: 'kit:resize', width: size.width, height: size.height, user, final };
    post(message);
  }

  /** @param {{ immediate?: boolean, final?: boolean, user?: boolean }} options */
  function fitNow(options) {
    if (!started || mode === 'fixed') return; // before the first fit there is nothing to redo
    watchRootSoon();
    requestSize(targetWidth(), contentHeight(), options);
  }

  // ---- Fit-content observation. The root is looked up on every fit, never cached once, so
  // replacing the demo markup (or adding [data-kit-root] later) keeps fitting.
  function syncObserver() {
    const wanted = started && mode === 'fit-content';
    if (!wanted) {
      if (observer) observer.disconnect();
      observer = null;
      observedRoot = null;
      window.clearTimeout(retargetTimer);
      retargetTimer = 0;
      return;
    }
    if (!observer) observer = new ResizeObserver(() => fitNow({}));
    watchRoot();
  }

  // A replaced root reports one last 0 x 0 size as it leaves the page, and the fit it triggers
  // already measures the new root (contentHeight() looks it up). Moving the observer waits for
  // the next task: observe() on a shallower element from inside an observer callback makes the
  // browser fire a "ResizeObserver loop completed with undelivered notifications" error event.
  function watchRootSoon() {
    if (!observer || retargetTimer || findRoot() === observedRoot) return;
    retargetTimer = window.setTimeout(() => {
      retargetTimer = 0;
      watchRoot();
    }, 0);
  }

  function watchRoot() {
    if (!observer) return;
    const root = findRoot();
    if (root === observedRoot) return;
    if (observedRoot) observer.unobserve(observedRoot);
    observer.observe(root);
    observedRoot = root;
  }

  // The first request doubles as "ready to show": code.ts keeps the window hidden until the
  // first kit:resize (or its own 500 ms cap), so it waits for fonts and for the real mode.
  function start() {
    if (started || !configured || !fontsLoaded) return;
    started = true;
    // kit:init's size is where code.ts has put the window (the restored or the default size).
    // The viewport can still be a host round trip behind it, and asking for the viewport's size
    // would undo the restore. A docked panel (chrome off) keeps its own size.
    const base = initSize && chromeOn() ? initSize : viewportSize();
    if (mode === 'fit-content') requestSize(base.width, contentHeight(), { immediate: true });
    // resizable never auto-fits: keep the saved or default size, just announce readiness.
    else if (mode === 'resizable') requestSize(base.width, base.height, { immediate: true });
    // fixed: visible from the start and never resized by the kit.
    syncObserver();
  }

  /**
   * @param {KitMode} nextMode
   * @param {boolean} nextChrome
   * @param {Partial<KitBounds> | null} nextBounds
   * @param {KitSize | null} size
   * @param {KitSize | null} fallbackDefault
   */
  function configure(nextMode, nextChrome, nextBounds, size, fallbackDefault) {
    mode = nextMode;
    chrome = nextChrome;
    bounds = sanitizeBounds(nextBounds);
    initSize = size ? clampSize(size.width, size.height, bounds) : null;
    const base = fallbackDefault || viewportSize();
    defaultSize = clampSize(base.width, base.height, bounds);
    configured = true;

    const on = chromeOn();
    const html = document.documentElement;
    html.dataset.kitChrome = on ? 'on' : 'off'; // CSS reserves the grip corner only while 'on'
    html.dataset.kitMode = mode;                // lets CSS pick the handle cursor per mode
    if (handle) handle.hidden = !on;

    if (!started) start();
    else {
      // kit:init arrived after the fallback had already started: the real mode wins. Main may
      // apply the fallback's fit after it sent kit:init, so ask again for the size kit:init
      // reported (resizable), or refit (fit-content). Main ignores kit:resize in fixed mode.
      syncObserver();
      if (mode === 'fit-content') fitNow({});
      else if (mode === 'resizable' && initSize && chromeOn()) requestSize(initSize.width, initSize.height, { immediate: true });
    }
  }

  /** @param {KitInitMessage} msg */
  function applyInit(msg) {
    window.clearTimeout(initTimer);
    if (msg.protocol !== KIT_PROTOCOL && !warnedProtocol) {
      warnedProtocol = true;
      // A string is quoted, so "1" and 1 read differently in the warning.
      const theirs = typeof msg.protocol === 'string' ? JSON.stringify(msg.protocol) : String(msg.protocol);
      console.warn(`kit: code.ts speaks protocol ${theirs}, this ui.html speaks ${KIT_PROTOCOL}. Re-paste the kit:window block (code.ts) and the three data-kit blocks (ui.html) from the same kit release.`);
    }
    // Validated field by field: a malformed init degrades to defaults instead of throwing.
    configure(
      isMode(msg.mode) ? msg.mode : CONFIG.fallbackMode,
      msg.chrome === true,
      msg.bounds,
      isSize(msg.size) ? msg.size : null,
      isSize(msg.defaultSize) ? msg.defaultSize : null,
    );
  }

  function useFallback() {
    if (configured) return;
    // No code.ts answered: no chrome (nothing would persist), generous bounds, still fit.
    configure(isMode(CONFIG.fallbackMode) ? CONFIG.fallbackMode : 'fit-content', false, null, null, null);
  }

  /** @param {unknown} value @returns {value is KitMainToUiMessage} */
  function isKitMessage(value) {
    return value !== null && typeof value === 'object' && /** @type {{ type?: unknown }} */ (value).type === 'kit:init';
  }

  /** @param {MessageEvent} event */
  function onMessage(event) {
    // Host messages (any type not starting with 'kit:') fall straight through: no
    // stopPropagation, no preventDefault, so the plugin's own listeners see every message.
    const data = event.data;
    /** @type {unknown} */
    const msg = data !== null && typeof data === 'object' ? data.pluginMessage : undefined;
    if (!isKitMessage(msg)) return;
    if (msg.type === 'kit:init') applyInit(msg);
  }

  function onViewportResize() {
    if (headingWidth !== null && window.innerWidth === headingWidth) headingWidth = null;
    if (headingHeight !== null && window.innerHeight === headingHeight) headingHeight = null;
    if (refitAtWidth !== null && window.innerWidth === refitAtWidth) {
      refitAtWidth = null;
      if (mode === 'resizable' && !drag) requestSize(window.innerWidth, contentHeight(), { final: true, user: true });
    }
  }

  // ---- Gestures. The handle is the <button data-kit-resize> in the markup; without it the
  // window still fits, there is just nothing to drag.

  /**
   * @param {KitSize} base
   * @returns {KitSize}
   */
  function snapTarget(base) {
    // Snaps outside the bounds would clamp to the current size and look like a dead key.
    const usable = CONFIG.snapWidths.filter((w) => w >= bounds.minWidth && w <= bounds.maxWidth);
    const width = nextSnap(base.width, usable.length > 0 ? usable : CONFIG.snapWidths);
    return { width, height: mode === 'resizable' ? base.height : contentHeight() };
  }

  /** @param {PointerEvent} event */
  function onPointerDown(event) {
    // Primary button of the primary pointer only: right-click or a second finger never drags.
    if (event.button !== 0 || !event.isPrimary || drag || !chromeOn() || !handle) return;
    pressMoved = false;
    const el = handle;
    try {
      el.setPointerCapture(event.pointerId);
    } catch {
      return; // no live pointer (synthetic event): without capture the drag could never end
    }
    // preventDefault stops text selection, but it also cancels the focus a mousedown would
    // give; focus explicitly so Escape reaches this frame and keys continue from here.
    // focusVisible:false: a script focus() otherwise draws the keyboard ring after a mouse drag
    // (browsers without the option ignore it).
    event.preventDefault();
    el.focus({ preventScroll: true, focusVisible: false });
    refitAtWidth = null;
    const now = currentSize();
    const start = clampSize(now.width, now.height, bounds);
    // One controller per drag: aborting it removes every listener below at once, however the
    // drag ends, so nothing outlives it (the old {once:true} listeners did, after Escape).
    const controller = new AbortController();
    const signal = controller.signal;
    drag = { controller, pointerId: event.pointerId, x: event.clientX, y: event.clientY, start, last: start, moved: false };
    el.addEventListener('pointermove', onPointerMove, { signal });
    el.addEventListener('pointerup', commitDrag, { signal });
    el.addEventListener('pointercancel', commitDrag, { signal }); // the person did move: keep it
    el.addEventListener('lostpointercapture', commitDrag, { signal });
    window.addEventListener('keydown', onDragKey, { signal, capture: true });
  }

  /** @param {PointerEvent} event */
  function onPointerMove(event) {
    const d = drag;
    if (!d || event.pointerId !== d.pointerId) return;
    // clientX/Y are stable across the resize: the window grows from its top-left corner.
    const width = d.start.width + (event.clientX - d.x);
    const height = mode === 'resizable' ? d.start.height + (event.clientY - d.y) : contentHeight();
    const target = clampSize(width, height, bounds);
    const changed = mode === 'resizable' ? !sameSize(target, d.start) : target.width !== d.start.width;
    if (!d.moved && !changed) return; // a click that wobbles inside one pixel is still a click
    d.moved = true;
    d.last = target;
    requestSize(target.width, target.height, { user: true });
  }

  /** @param {PointerEvent} event */
  function commitDrag(event) {
    // Only the dragging pointer ends the drag: a second finger or a stray tap lifting does not.
    if (drag && event.pointerId === drag.pointerId) endDrag(true);
  }

  /** @param {KeyboardEvent} event */
  function onDragKey(event) {
    if (event.key !== 'Escape') return;
    // Escape belongs to the drag while one is active, so the host's own Escape (close a panel,
    // close the plugin) doesn't fire as well. Only another capture listener on window still
    // sees it: stopPropagation can't stop listeners on the same target.
    event.preventDefault();
    event.stopPropagation();
    endDrag(false);
  }

  /** @param {boolean} keep true commits the last size, false reverts to the start size */
  function endDrag(keep) {
    const d = drag;
    if (!d) return;
    drag = null;
    pressMoved = d.moved;
    d.controller.abort();
    if (handle && handle.hasPointerCapture(d.pointerId)) handle.releasePointerCapture(d.pointerId);
    if (!d.moved) return; // plain click, or Escape before any change: nothing to persist or undo
    const size = keep ? d.last : d.start;
    // fit-content measures the height now. The drag's own height was measured before its width
    // landed and the content reflowed; sent as the final, it would overwrite the observer's
    // newer fit, and with the root's size unchanged nothing would ever correct it.
    requestSize(size.width, mode === 'resizable' ? size.height : contentHeight(), { final: true, user: true });
  }

  /** @param {MouseEvent} event */
  function onDoubleClick(event) {
    // A second press that dragged already resized the window: no snap on top of it.
    if (event.button !== 0 || drag || pressMoved || !chromeOn()) return;
    event.preventDefault();
    refitAtWidth = null;
    const next = snapTarget(currentSize());
    requestSize(next.width, next.height, { final: true, user: true });
  }

  /** @param {KeyboardEvent} event */
  function onKeyDown(event) {
    if (drag || !chromeOn() || event.altKey || event.ctrlKey || event.metaKey) return;
    const base = currentSize();
    const step = event.shiftKey ? CONFIG.bigStep : CONFIG.step;
    /** @type {KitSize} */
    let next;
    switch (event.key) {
      case 'ArrowLeft':
      case 'ArrowRight':
        next = {
          width: base.width + (event.key === 'ArrowRight' ? step : -step),
          height: mode === 'resizable' ? base.height : contentHeight(),
        };
        break;
      case 'ArrowUp':
      case 'ArrowDown':
        if (mode !== 'resizable') return; // fit-content owns the height; let the page scroll
        next = { width: base.width, height: base.height + (event.key === 'ArrowDown' ? step : -step) };
        break;
      case 'Enter':
      case ' ':
      case 'Home':
        event.preventDefault();
        if (event.repeat) return; // holding Enter would spin through the snaps
        if (event.key === 'Home') {
          next = { width: defaultWidth(), height: contentHeight() };
          if (mode === 'resizable' && next.width !== window.innerWidth) refitAtWidth = clampSize(next.width, 0, bounds).width;
        } else next = snapTarget(base);
        break;
      default:
        return;
    }
    event.preventDefault();
    if (event.key !== 'Home') refitAtWidth = null; // a newer gesture replaces Home's pending refit
    requestSize(next.width, next.height, { final: true, user: true });
  }

  // Merge <script type="application/json" data-kit-config> over CONFIG. Unknown keys and values
  // of the wrong shape are ignored with one warning, so a typo can't break the window.
  function applyConfigOverrides() {
    const el = document.querySelector('script[type="application/json"][data-kit-config]');
    if (!el) return;
    /** @type {unknown} */
    let raw;
    try { raw = JSON.parse(el.textContent || '{}'); } catch (error) {
      console.warn('[kit] data-kit-config is not valid JSON; using defaults.', error);
      return;
    }
    /** @param {unknown} v @returns {v is Record<string, unknown>} */
    const isObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
    if (!isObject(raw)) {
      console.warn('[kit] data-kit-config must be a JSON object, such as {"snapWidths": [300, 400]}; using defaults.');
      return;
    }
    /** @param {unknown} v */
    const positive = (v) => typeof v === 'number' && Number.isFinite(v) && v > 0;
    /** @type {string[]} */
    const ignored = [];
    for (const key of Object.keys(raw)) {
      const v = raw[key];
      if (key === 'snapWidths' && Array.isArray(v) && v.length > 0 && v.every(positive)) CONFIG.snapWidths = v.slice();
      // Whole pixels, at least 1: a fractional step rounds back to the same width, a dead key.
      else if ((key === 'step' || key === 'bigStep') && typeof v === 'number' && Number.isInteger(v) && v >= 1) CONFIG[key] = v;
      // setTimeout treats anything past 2^31 - 1 ms as 0.
      else if (key === 'initTimeoutMs' && typeof v === 'number' && Number.isFinite(v) && v >= 0 && v <= 0x7fffffff) CONFIG.initTimeoutMs = v;
      else if (key === 'fallbackMode' && isMode(v)) CONFIG.fallbackMode = v;
      else if (key === 'strings' && isObject(v)) {
        for (const name of Object.keys(v)) {
          const text = v[name];
          // A blank label would leave the handle without an accessible name.
          if (name === 'resizeLabel' && typeof text === 'string' && text.trim() !== '') CONFIG.strings.resizeLabel = text;
          else ignored.push('strings.' + name);
        }
      } else ignored.push(key);
    }
    if (ignored.length > 0) console.warn('[kit] data-kit-config: ignored ' + ignored.join(', ') + ' (unknown key or wrong type).');
  }

  // ---- Startup. Listeners registered here are the only long-lived ones: three on the handle,
  // two on window. Everything a drag adds is removed when it ends.
  function boot() {
    applyConfigOverrides();
    mode = CONFIG.fallbackMode;
    const found = document.querySelector('[data-kit-resize]');
    handle = found instanceof HTMLElement ? found : null;
    if (handle) {
      handle.setAttribute('aria-label', CONFIG.strings.resizeLabel);
      handle.addEventListener('pointerdown', onPointerDown);
      handle.addEventListener('dblclick', onDoubleClick);
      handle.addEventListener('keydown', onKeyDown);
    }
    window.addEventListener('message', onMessage);
    window.addEventListener('resize', onViewportResize);

    // Measuring before web fonts settle fits the fallback font's line heights. A font that never
    // settles (a request that hangs) must not keep the window from fitting, so the wait is capped
    // at CONFIG.initTimeoutMs; in fit-content mode the observer refits when the font swaps in.
    /** @type {Promise<unknown>} */
    const fonts = 'fonts' in document ? document.fonts.ready : Promise.resolve();
    const fontCap = new Promise((resolve) => window.setTimeout(resolve, CONFIG.initTimeoutMs));
    Promise.race([fonts.catch(() => undefined), fontCap]).then(() => {
      fontsLoaded = true;
      start();
    });

    initTimer = window.setTimeout(useFallback, CONFIG.initTimeoutMs);
    post({ type: 'kit:ready', protocol: KIT_PROTOCOL });
  }

  /** @type {KitUiApi} */
  const api = Object.freeze({ version: KIT_VERSION, protocol: KIT_PROTOCOL, fit: () => fitNow({}) });
  window.kit = api;

  // This script sits in <head>, before the handle and the root exist.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
  else boot();
})();
</script>

<script>

  const shape = /** @type {HTMLSelectElement} */ (document.getElementById('shape'));

  const closeButton = /** @type {HTMLButtonElement} */ (document.getElementById('close'));
  const status = /** @type {HTMLElement} */ (document.getElementById('status'));

  let selected = 0;

  function post(message) {

  /** The count as a number, or null when it is not a whole number in range. */
  function readCount() {
    const text = count.value.trim();
    if (!/^\d+$/.test(text)) return null;
    const n = Number(text);
    return n >= MIN_COUNT && n <= MAX_COUNT ? n : null;
  }

  // The error state is aria-invalid on the input. The kit's CSS recolours the ring and the help
  // text the input already points at with aria-describedby, so no class is toggled.
  function validate() {
    const ok = readCount() !== null;
    if (ok) count.removeAttribute('aria-invalid');
    else count.setAttribute('aria-invalid', 'true');
    countHelp.textContent = ok ? HELP : ERROR;
  }

  function render() {
    const selection = selected === 0 ? 'Nothing selected'
      : `${selected} layer${selected === 1 ? '' : 's'} selected`;
    // The last result goes on its own line, so a narrow window never breaks it mid-phrase.
    status.replaceChildren(selection, ...(result ? [document.createElement('br'), result] : []));
  }

  function createShapes() {
    // aria-busy blocks the mouse but not Enter or Space, so the handler checks it too.
    if (create.getAttribute('aria-busy') === 'true') return;
    const n = readCount();
    if (n === null) {
      validate();
      count.focus();
      return;
    }
    requestedShape = shape.value;
    create.setAttribute('aria-busy', 'true');
    post({ type: 'create-shapes', count: n, shape: requestedShape });
  }

  count.addEventListener('input', validate);
  create.addEventListener('click', createShapes);
  // Enter in the count field creates too. Deliberately not a <form>: a sandboxed iframe without
  // allow-forms blocks form submission before the submit event fires, and Figma's sandbox flags
  // are not documented.
  count.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' || event.isComposing) return;
    event.preventDefault();
    createShapes();
  });

  closeButton.addEventListener('click', () => post({ type: 'close' }));

  // Registered at the top level, before the page finishes loading: Figma delivers the messages
  // code.ts posted at startup (the first selection count) as soon as the page has loaded.
  window.addEventListener('message', (event) => {
    const msg = event.data && event.data.pluginMessage;
    if (!msg || typeof msg !== 'object' || typeof msg.count !== 'number') return;
    if (msg.type === 'selection') {
      selected = msg.count;
      render();
    } else if (msg.type === 'created') {
      // code.ts always answers, with count 0 when creating failed, so the button never sticks.
      create.removeAttribute('aria-busy');
      result = msg.count > 0 ? `Created ${msg.count} ${requestedShape}${msg.count === 1 ? '' : 's'}` : 'Nothing created';
      render();
    }
  });
})();
</script>
</body>
</html>
