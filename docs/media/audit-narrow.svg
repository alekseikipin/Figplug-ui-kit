<title id="t">npm run audit catches a hard-coded colour</title>
<desc id="d">Animated illustration with real audit output from kit 0.4.0: a rule with color: #333; is added to the host &lt;style&gt; in ui.html at line 951. npm run audit prints &quot;ui.html:951  color-literal  literal colour #333 in color; use a var(--figma-color-*) token (transparent and currentColor are fine)&quot; and &quot;audit: 1 error(s), 0 warning(s) in 6 plugin folders; see docs/pitfalls.md&quot;. The value is replaced with var(--figma-color-text), and the next npm run audit prints &quot;audit: no problems in 6 plugin folders&quot;.</desc>
