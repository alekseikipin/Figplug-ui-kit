<svg xmlns="http://www.w3.org/2000/svg" width="400" height="526" viewBox="0 0 400 526" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">How the kit works: two threads and their messages</title>
<desc id="d">Animated diagram, narrow version. code.ts runs on Figma's main thread (the figma API, no DOM); ui.html runs in an iframe (the DOM, no figma object). installKitWindow() opens the window hidden at 320 × 360. The runtime sends kit:ready { protocol: 1 }, code.ts answers kit:init { mode, chrome, bounds, size, … }, the runtime measures the content and sends kit:resize { width: 320, height: 237, … }, and code.ts calls figma.ui.resize and shows the window at that size. (That this removes a blank or unfitted flash in Figma itself is still to be re-checked in a Figma run.) Clicking Create sends the demo's create-shapes message; code.ts answers created and selection, and one more kit:resize grows the window to 245. Sizes are those of the starter in the kit's browser preview.</desc>
