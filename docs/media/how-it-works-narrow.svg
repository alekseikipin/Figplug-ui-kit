<g class="an k12 hide"><text class="s caph" x="16" y="418">2 · Shown once it has fitted its content</text><text class="s capd" x="16" y="438">Hidden until then, so it shouldn’t flash blank or jump (to</text><text class="s capd" x="16" y="454">re-check in Figma).</text></g>
