<svg xmlns="http://www.w3.org/2000/svg" width="400" height="796" viewBox="0 0 400 796" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">The one prompt, run by a coding agent</title>
<desc id="d">Animated illustration, not a recording: the README's one prompt, with the rename-layers task from docs/prompts.md (&quot;renames the selected layers with a prefix, find and replace, and optional numbering, and shows a preview of the new names before I apply them&quot;), is typed into a coding agent (Claude Code, Cursor or similar). The agent clones the repo, reads AGENTS.md and docs/components.md, edits manifest.json, ui.html and code.ts, runs npm install, npm run build, npm run audit (&quot;audit: no problems in 7 plugin folders&quot;) and npm run check:ui (&quot;check-ui: no type errors in 7 plugin folders&quot;), then says how to import the plugin: Figma → Plugins → Development → Import plugin from manifest… → pick manifest.json. The command output lines are real output from kit 0.4.0.</desc>
