  const add = (tag) => document.body.appendChild(Object.assign(document.createElement(tag), { className: 'kit-visually-hidden' }));
  const hint = document.getElementById('kit-resize-hint') || Object.assign(add('p'), { id: 'kit-resize-hint' });
  hint.textContent = CONFIG.strings.resizeHint;
  const ids = (el.getAttribute('aria-describedby') || '').split(/\s+/).filter(Boolean);
  if (ids.indexOf(hint.id) < 0) el.setAttribute('aria-describedby', ids.concat(hint.id).join(' '));
  const region = document.querySelector('[data-kit-announce]');
  announcer = region instanceof HTMLElement ? region : add('div');
  if (!region) announcer.setAttribute('data-kit-announce', '');
  announcer.setAttribute('aria-live', 'polite');
}

// ---- Menus (docs/components.md#menu): the popover API opens and closes them; this adds the rest.
/** @type {HTMLElement | null} */ let menuOpen = null;
/** @type {HTMLElement | null} */ let menuInvoker = null;
/** @param {unknown} el @returns {el is HTMLElement} */
function isMenu(el) { return el instanceof HTMLElement && el.matches('.kit-menu[popover]'); }
/** @param {ParentNode} root @param {string} selector @param {(el: HTMLElement) => boolean} keep */
function elements(root, selector, keep) { return Array.from(root.querySelectorAll(selector)).filter(/** @returns {el is HTMLElement} */ (el) => el instanceof HTMLElement && keep(el)); }
/** @param {HTMLElement} menu */
function menuInvokers(menu) { return elements(document, '[popovertarget]', (el) => el.getAttribute('popovertarget') === menu.id); }
/** @param {HTMLElement} menu */
function menuItems(menu) { return elements(menu, '.kit-menu-item', (el) => !el.matches(':disabled, [aria-disabled="true"]')); }
function placeOpenMenu() {
  if (!menuOpen || !menuInvoker || !menuOpen.matches(':popover-open')) return;
  Object.assign(menuOpen.style, { left: '0px', top: '0px' });
  const { clientWidth: width, clientHeight: height } = document.documentElement;
  const at = placeMenu(menuInvoker.getBoundingClientRect(), menuOpen.getBoundingClientRect(), { width, height });
  Object.assign(menuOpen.style, { left: at.left + 'px', top: at.top + 'px' });
}
/** @param {Event} e */
function onMenuToggle(e) {
  const menu = e.target;
  const { newState, source } = /** @type {ToggleEvent} */ (e);
  if (!isMenu(menu)) return;
  const open = newState === 'open';
  if (e.type === 'beforetoggle') {
    if (open) {
      menuOpen = menu;
      menuInvoker = source instanceof HTMLElement ? source : menuInvoker && menuInvoker.getAttribute('popovertarget') === menu.id ? menuInvoker : menuInvokers(menu)[0] || null;
      requestAnimationFrame(placeOpenMenu);
    } else if (menuOpen === menu) menuOpen = null;
    return;
  }
  for (const el of menuInvokers(menu)) el.setAttribute('aria-expanded', String(open));
  if (!open || menu !== menuOpen) return;
  placeOpenMenu();
  const first = menuItems(menu)[0];
  if (first) first.focus({ preventScroll: true });
}
/** @param {KeyboardEvent} e */
function onMenuKey(e) {
  const el = e.target;
  if (!(el instanceof HTMLElement) || e.isComposing || e.altKey || e.ctrlKey || e.metaKey) return;
  const menu = el.closest('.kit-menu');
  if (e.key === 'Escape' && menuOpen && menuOpen.matches(':popover-open')) {
    e.preventDefault();
    e.stopPropagation(); // the menu's Escape, not the host's
    menuOpen.hidePopover();
    if (menuInvoker) menuInvoker.focus();
  } else if (!isMenu(menu)) {
    const target = document.getElementById(el.getAttribute('popovertarget') || '');
    if (e.key !== 'ArrowDown' || !isMenu(target) || target.matches(':popover-open')) return;
    e.preventDefault();
    menuInvoker = el;
    target.showPopover({ source: el });
  } else if (e.key === 'Tab') menu.hidePopover();
  else {
    const items = menuItems(menu);
    const before = items.filter((item) => el.compareDocumentPosition(item) & Node.DOCUMENT_POSITION_PRECEDING);
    const after = items.filter((item) => el.compareDocumentPosition(item) & Node.DOCUMENT_POSITION_FOLLOWING);
    const last = items[items.length - 1];
    const next = /** @type {Record<string, HTMLElement | undefined>} */ ({ ArrowDown: after[0] || items[0], ArrowUp: before[before.length - 1] || last, Home: items[0], End: last })[e.key];
    if (!next) return;
    e.preventDefault();
    next.focus();
  }
}
/** @param {Event} e */
function onMenuScroll(e) { if (menuOpen && !(e.target instanceof Node && menuOpen.contains(e.target))) placeOpenMenu(); }
/** @param {MouseEvent} e */
function onMenuClick(e) {
  const item = e.target instanceof Element ? e.target.closest('.kit-menu-item') : null;
  const menu = item && item.closest('.kit-menu');
  if (!item || !isMenu(menu) || item.matches('[aria-disabled="true"]')) return;
  // After every click listener: a host's preventDefault() keeps it open.
  setTimeout(() => { if (!e.defaultPrevented && menu.matches(':popover-open')) menu.hidePopover(); }, 0);
}

function applyConfigOverrides() {
  const el = document.querySelector('script[type="application/json"][data-kit-config]');
  if (!el) return;
  /** @param {unknown} v @returns {v is Record<string, unknown>} */
  const isObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
  /** @type {unknown} */ let raw;
  try { raw = JSON.parse(el.textContent || '{}'); } catch (error) {
    return console.warn('[kit] data-kit-config is not valid JSON; using defaults.', error);
  }
  if (!isObject(raw)) return console.warn('[kit] data-kit-config must be a JSON object; using defaults.');
  /** @type {string[]} */ const ignored = [];
  for (const [key, v] of Object.entries(raw)) {
    if (key === 'snapWidths' && Array.isArray(v) && v.length > 0 && v.every((n) => typeof n === 'number' && Number.isFinite(n) && n > 0)) CONFIG.snapWidths = v.slice();
    else if ((key === 'step' || key === 'bigStep') && typeof v === 'number' && Number.isInteger(v) && v >= 1) CONFIG[key] = v;
    else if (key === 'initTimeoutMs' && typeof v === 'number' && v >= 0 && v <= 0x7fffffff) CONFIG.initTimeoutMs = v;
    else if (key === 'fallbackMode' && isMode(v)) CONFIG.fallbackMode = v;
    else if (key === 'strings' && isObject(v)) {
      for (const [name, text] of Object.entries(v)) {
        if ((name === 'resizeLabel' || name === 'resizeHint' || name === 'announce') && typeof text === 'string' && text.trim() !== '') CONFIG.strings[name] = text;
        else ignored.push('strings.' + name);
      }
    } else ignored.push(key);
  }
  if (ignored.length > 0) console.warn('[kit] data-kit-config: ignored ' + ignored.join(', ') + ' (unknown key or wrong type).');
}

// The only long-lived listeners: three on the handle, two on window, five on document.
function boot() {
  applyConfigOverrides();
  mode = CONFIG.fallbackMode;
  const found = document.querySelector('[data-kit-resize]');
  handle = found instanceof HTMLElement ? found : null;
  if (handle) {
    handle.setAttribute('aria-label', CONFIG.strings.resizeLabel);
    describeHandle(handle);
    handle.addEventListener('pointerdown', onPointerDown);
    handle.addEventListener('dblclick', onDoubleClick);
    handle.addEventListener('keydown', onKeyDown);
  }
  window.addEventListener('message', onMessage);
  window.addEventListener('resize', onViewportResize);
  if (typeof HTMLElement.prototype.showPopover === 'function') {
    document.addEventListener('beforetoggle', onMenuToggle, true);
    document.addEventListener('toggle', onMenuToggle, true);
    document.addEventListener('keydown', onMenuKey, true);
    document.addEventListener('click', onMenuClick, true);
    document.addEventListener('scroll', onMenuScroll, { capture: true, passive: true });
  }
  /** @type {Promise<unknown>} */
  const fonts = 'fonts' in document ? document.fonts.ready : Promise.resolve();
  const fontCap = new Promise((resolve) => setTimeout(resolve, CONFIG.initTimeoutMs));
  Promise.race([fonts.catch(() => undefined), fontCap]).then(() => { fontsLoaded = true; start(); });
  initTimer = setTimeout(useFallback, CONFIG.initTimeoutMs);
  post({ type: 'kit:ready', protocol: KIT_PROTOCOL });
}

window.kit = Object.freeze({ version: KIT_VERSION, protocol: KIT_PROTOCOL, fit: () => fitNow() });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
else boot();
})();
</script>
<style>
/* Your styles. Build with kit classes first; add rules here only for what they don't cover. */
.scales { column-gap: var(--kit-spacer-3); }
/* Insets the rows by 8px, so their text lines up with the section header's title, as in UI3. */
.layers { padding: 0 var(--kit-spacer-2) var(--kit-spacer-2); }
</style>
</head>
<body>
<main class="kit-app" data-kit-root>
  <h1 class="kit-visually-hidden">Export selection</h1>
  <div class="kit-section">
    <div class="kit-field" role="radiogroup" aria-labelledby="scale-label" aria-describedby="scale-help">
      <span class="kit-label" id="scale-label">Scale</span>
      <div class="kit-row scales">
        <label class="kit-radio"><input type="radio" name="scale" value="1">1x</label>
        <label class="kit-radio"><input type="radio" name="scale" value="2" checked>2x</label>
        <label class="kit-radio"><input type="radio" name="scale" value="3">3x</label>
      </div>
      <p class="kit-help" id="scale-help">One PNG per layer, named after it: Button@2x.png</p>
    </div>
  </div>
  <hr class="kit-divider">
  <header class="kit-section-header"><h2 id="layers-title">Layers</h2></header>
  <div class="layers">
    <ul class="kit-list" id="list" aria-labelledby="layers-title" hidden></ul>
    <div class="kit-empty" id="empty">
      <svg class="kit-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5v8m-3.5-3.5 3.5 3.5 3.5-3.5M7 17.5h10" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p class="kit-empty-title" id="empty-title">No layers selected</p>
      <p class="kit-empty-text" id="empty-text">Select the layers you want to export on the canvas.</p>
    </div>
  </div>
  <footer class="kit-footer">
    <p class="kit-text-secondary" id="status" role="status">Nothing selected</p>
    <button class="kit-button kit-button-primary" id="export" type="button" disabled>Export</button>
  </footer>
</main>
<button class="kit-resize-handle" type="button" data-kit-resize hidden aria-label="Resize window"></button>
<script>
'use strict';
// Export selection (kit example). Sends png-export and png-save-scale; code.ts answers
// png-selection, png-settings, png-file (one per exported layer, bytes as a Uint8Array) and png-done.
// The window is resizable: the list grows in the page, which scrolls under the sticky footer.
(() => {
const byId = (id) => document.getElementById(id);
const exportButton = /** @type {HTMLButtonElement} */ (byId('export'));
const radios = /** @type {NodeListOf<HTMLInputElement>} */ (document.querySelectorAll('input[name="scale"]'));
const list = byId('list');
const status = byId('status');
/** @type {{ id: string, name: string, width: number, height: number }[]} */
let layers = [];
let count = 0;
let max = 100;
let result = '';
let touched = false;
// Files waiting for their download, downloads started in this export, and png-done's failures.
// The bytes arrive structured-cloned, so their buffer is a plain ArrayBuffer, which Blob accepts.
/** @typedef {{ name: string, bytes: Uint8Array<ArrayBuffer> }} PngFile */
/** @type {PngFile[]} */
const queue = [];
let pumping = false;
let started = 0;
/** @type {string[] | null} */
let failed = null;

/** @param {{ type: string } & Record<string, unknown>} message */
const post = (message) => parent.postMessage({ pluginMessage: message }, '*');
/** @param {number} n @param {string} word */
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
/** @param {unknown} n */
const isCount = (n) => typeof n === 'number' && Number.isInteger(n) && n >= 0;

function scale() {
  const checked = Array.from(radios).find((radio) => radio.checked);
  return checked ? Number(checked.value) : 2;
}

/** @param {{ name: string, width: number, height: number }} layer @param {number} s */
function row(layer, s) {
  const item = document.createElement('li');
  const label = document.createElement('span');
  const meta = document.createElement('span');
  item.className = 'kit-list-row';
  label.className = 'kit-list-row-label';
  label.textContent = layer.name;
  label.title = layer.name;
  meta.className = 'kit-list-row-meta';
  meta.textContent = layer.width && layer.height ? `${Math.round(layer.width * s)} × ${Math.round(layer.height * s)}` : 'Nothing visible';
  item.append(label, meta);
  return item;
}

function render() {
  const s = scale();
  const tooMany = count > max;
  byId('scale-help').textContent = `One PNG per layer, named after it: Button${s === 1 ? '' : `@${s}x`}.png`;
  list.hidden = layers.length === 0;
  byId('empty').hidden = layers.length > 0;
  byId('empty-title').textContent = tooMany ? 'Too many layers selected' : 'No layers selected';
  byId('empty-text').textContent = tooMany ? `Export takes up to ${max} layers at a time.` : 'Select the layers you want to export on the canvas.';
  list.replaceChildren(...layers.map((layer) => row(layer, s)));
  exportButton.disabled = layers.length === 0;
  const text = result || (count === 0 ? 'Nothing selected' : `${plural(count, 'layer')} selected`);
  if (status.textContent !== text) status.textContent = text; // announce changes only
}

/** @param {PngFile} file */
function download(file) {
  const url = URL.createObjectURL(new Blob([file.bytes], { type: 'image/png' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = file.name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  started++;
}

function finish() {
  const names = failed || [];
  failed = null;
  exportButton.removeAttribute('aria-busy');
  const which = names.length > 3 ? `${names.slice(0, 3).join(', ')} and ${names.length - 3} more` : names.join(', ');
  // A page can't tell whether the browser saved a file, so say what was started.
  const parts = [];
  if (started > 0) parts.push(`Started ${plural(started, 'download')}`);
  if (names.length > 0) parts.push(`Couldn't export ${which}`);
  result = parts.join('. ') || 'No downloads started';
  render();
}

// One download every 200 ms: a browser may drop downloads that start in the same instant.
function pump() {
  const file = queue.shift();
  if (file) {
    download(file);
    setTimeout(pump, 200);
    return;
  }
  pumping = false;
  if (failed) finish();
}

exportButton.addEventListener('click', () => {
  if (exportButton.getAttribute('aria-busy') === 'true' || layers.length === 0) return; // aria-busy stops the mouse, not Enter
  exportButton.setAttribute('aria-busy', 'true');
  started = 0;
  result = `Exporting ${plural(layers.length, 'layer')}…`;
  render();
  post({ type: 'png-export', ids: layers.map((layer) => layer.id), scale: scale() });
});

radios.forEach((radio) => radio.addEventListener('change', () => {
  touched = true;
  post({ type: 'png-save-scale', scale: scale() });
  render();
}));

// Added at once: Figma delivers what code.ts posted at startup as soon as the page has loaded.
window.addEventListener('message', (event) => {
  const msg = event.data && event.data.pluginMessage;
  if (!msg || typeof msg !== 'object') return;
  if (msg.type === 'png-selection' && Array.isArray(msg.layers) && isCount(msg.count) && isCount(msg.max)) {
    layers = msg.layers;
    count = msg.count;
    max = msg.max;
    if (exportButton.getAttribute('aria-busy') !== 'true') result = '';
  } else if (msg.type === 'png-settings') {
    const saved = Array.from(radios).find((radio) => radio.value === String(msg.scale));
    if (touched || !saved) return;
    saved.checked = true;
  } else if (msg.type === 'png-file' && msg.bytes instanceof Uint8Array && typeof msg.name === 'string') {
    queue.push(msg);
    if (!pumping) {
      pumping = true;
      pump();
    }
    return;
  } else if (msg.type === 'png-done' && Array.isArray(msg.failed)) {
    failed = msg.failed;
    if (!pumping) finish();
    return;
  } else return;
  render();
});
})();
</script>
</body>
</html>
