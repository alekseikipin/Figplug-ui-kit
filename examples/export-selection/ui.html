    count = msg.count;
    max = msg.max;
    if (exportButton.getAttribute('aria-busy') !== 'true') result = '';
  } else if (msg.type === 'png-settings') {
    const saved = Array.from(radios).find((radio) => radio.value === String(msg.scale));
    if (touched || !saved) return;
    saved.checked = true;
  } else if (msg.type === 'png-file' && msg.bytes instanceof Uint8Array && typeof msg.name === 'string') {
    queue.push(msg);
    if (!pumping) {
      pumping = true;
      pump();
    }
    return;
  } else if (msg.type === 'png-done' && Array.isArray(msg.failed)) {
    failed = msg.failed;
    if (!pumping) finish();
    return;
  } else return;
  render();
});
})();
</script>
</body>
</html>
